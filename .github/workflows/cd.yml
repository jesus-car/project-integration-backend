name: Deploy

on:
    push:
        branches:
            - develop

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
            AWS_REGION: ${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
            EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    distribution: 'corretto'
                    java-version: '17'
            -   name: Set environment variables for build
                run: |
                    AWS_ACCESS_KEY=$AWS_ACCESS_KEY
                    AWS__SECRET_KEY=$AWS_SECRET_KEY
                    AWS_REGION=$AWS_REGION
                    AWS_S3_BUCKET=$AWS_S3_BUCKET
                    EMAIL_USERNAME=$EMAIL_USERNAME
                    EMAIL_PASSWORD=$EMAIL_PASSWORD
                    SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
                    SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
                    SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            -   name: Build with Mave
                run: mvn -q clean package --file pom.xml -DskipTests

            -   name: Build & push Docker image
                uses: mr-smithers-excellent/docker-build-push@v6
                with:
                    image: jesuscar/ci-demo
                    tags: latest
                    registry: docker.io
                    dockerfile: Dockerfile
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: SSH to EC2
                run: |
                    echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > primerkey.pem
                    chmod 400 "primerkey.pem"
            -   name: Deploy to EC2
                run: |
                    ssh -i "primerkey.pem" -o StrictHostKeyChecking=no -t $EC2_USERNAME@$EC2_URL << 'EOF'
                      sudo docker stop backend-integration || true
                      sudo docker rm backend-integration || true
                      sudo docker image prune -a -f
                      sudo docker pull jesuscar/ci-demo:latest
                      sudo docker run -d -p 8080:9000 --name backend-integration \
                        -e AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
                        -e AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
                        -e AWS_REGION=${{ secrets.AWS_REGION }} \
                        -e AWS_S3_BUCKET=${{  secrets.AWS_S3_BUCKET }} \
                        -e EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }} \
                        -e EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }} \
                        -e SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} \
                        -e SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
                        -e SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
                        jesuscar/ci-demo
                    EOF